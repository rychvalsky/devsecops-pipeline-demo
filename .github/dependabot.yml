# Dependabot keeps dependencies current by opening PRs. Combined with the
# `deps` CI job (pip-audit) this covers both "tell me" and "fix it for me".
version: 2
updates:
  # Python runtime + dev dependencies.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps instead of many.
      minor-and-patch:
        update-types: [minor, patch]

  # The versions of the actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
