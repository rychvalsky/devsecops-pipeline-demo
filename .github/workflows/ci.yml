name: CI

# Runs on every push to main and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pipeline only reads the repo in this phase. Later phases that upload
# SARIF to the Security tab will widen this per-job.
permissions:
  contents: read

# A newer push to the same branch cancels an in-progress run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Coverage settings (incl. the --cov-fail-under gate) live in pyproject.toml;
      # here we only add machine-readable report formats for the artifact.
      - name: Run tests
        run: pytest --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed to publish results to the Security tab
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Scan the application package and emit SARIF. `|| true`: a finding must be
      # visible in the Security tab, not silently abort the pipeline. F9 removes
      # the planted finding, after which this can be tightened to fail on issues.
      - name: Run Bandit
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif || true

      - name: Publish Bandit results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit SARIF artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-sarif
          path: bandit.sarif
