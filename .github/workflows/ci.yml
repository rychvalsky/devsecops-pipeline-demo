name: CI

# Runs on every push to main and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pipeline only reads the repo in this phase. Later phases that upload
# SARIF to the Security tab will widen this per-job.
permissions:
  contents: read

# A newer push to the same branch cancels an in-progress run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Coverage settings (incl. the --cov-fail-under gate) live in pyproject.toml;
      # here we only add machine-readable report formats for the artifact.
      - name: Run tests
        run: pytest --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # needed to publish results to the Security tab
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Since F9 there are no planted findings, so Bandit is a hard gate: a new
      # HIGH/MEDIUM issue fails the job. The SARIF still uploads either way.
      - name: Run Bandit
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif

      - name: Publish Bandit results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sarif
          path: bandit.sarif

  deps:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Audit the runtime dependency tree (pip-audit resolves transitive deps
      # from requirements.txt). Non-blocking: known-vuln drift in a pinned tree
      # should be reported, and Dependabot opens the bump PR. F8 consumes the
      # JSON; the Markdown copy lands in the run summary.
      - name: Audit runtime dependencies
        run: |
          pip-audit -r requirements.txt --desc -f json -o pip-audit.json --progress-spinner off || true
          {
            echo "### pip-audit — runtime dependencies"
            echo
            pip-audit -r requirements.txt --desc -f markdown --progress-spinner off || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit.json

  build:
    name: Image build + scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # publish SARIF to the Security tab
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t devsecops-pipeline-demo:ci .

      # Prove the built image actually runs before we bother scanning it.
      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 8000:8000 devsecops-pipeline-demo:ci
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          docker rm -f api

      # (a) Known vulnerabilities in the image's OS + Python packages.
      - name: Trivy - image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-pipeline-demo:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          # exit-code defaults to 0 -> findings are reported, not fatal.

      # (b) Misconfiguration in the Dockerfile -- expected: DS002 (runs as root).
      - name: Trivy - Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-config.sarif

      - name: Publish Trivy image results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Publish Trivy config results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Upload Trivy SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: |
            trivy-image.sarif
            trivy-config.sarif

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # "Deploy the test app": bring the container up on the runner and wait
      # for it to report healthy before pointing a scanner at it.
      - name: Start the app
        run: |
          docker compose up -d --build
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8010/health && break
            sleep 2
          done
          curl -fsS http://localhost:8010/health | grep -q '"status":"ok"'

      # Spider + passive scan only (no attacks). Non-blocking, and it does not
      # open a GitHub issue -- the report is an artifact + a run-summary table.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8010
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report

      - name: Stop the app
        if: always()
        run: docker compose down

  report:
    name: Aggregated security report
    runs-on: ubuntu-latest
    needs: [test, sast, deps, build, dast]
    if: always()  # still summarise whatever ran
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Pull every previous job's artifact into artifacts/<artifact-name>/.
      - name: Download scan artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge into one report
        run: |
          python scripts/build_report.py \
            --bandit       artifacts/bandit-sarif/bandit.sarif \
            --pip-audit    artifacts/pip-audit-report/pip-audit.json \
            --trivy-image  artifacts/trivy-sarif/trivy-image.sarif \
            --trivy-config artifacts/trivy-sarif/trivy-config.sarif \
            --zap          artifacts/zap-baseline-report/report_json.json \
            --out security-report.md
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: security-report.md
