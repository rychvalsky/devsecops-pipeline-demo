name: DAST — Juice Shop (authenticated)

# Juice Shop runs only on an internal Docker network inside the runner.
# It is never reachable from the internet and is destroyed when the job ends.

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  schedule:
    - cron: '0 3 * * 1'       # Mondays 03:00 UTC — keeps the report link fresh
  push:
    branches: [main]
    paths:
      - '.github/workflows/dast-juice-shop.yml'
      - 'zap/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  JUICE_SHOP_IMAGE: bkimminich/juice-shop:v17.1.1
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  dast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Bring up the target
      # ---------------------------------------------------------------
      - name: Create isolated Docker network
        run: docker network create zapnet

      - name: Start Juice Shop
        run: |
          docker run -d --name juiceshop \
            --network zapnet \
            -p 127.0.0.1:3000:3000 \
            "$JUICE_SHOP_IMAGE"

      - name: Wait for Juice Shop to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "Juice Shop is up after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Juice Shop did not come up in 120s"
          docker logs juiceshop
          exit 1

      # ---------------------------------------------------------------
      # 2. Authenticate — this is the step most portfolio projects skip
      # ---------------------------------------------------------------
      - name: Log in and capture JWT
        id: auth
        run: |
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:3000/rest/user/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@juice-sh.op","password":"admin123"}')

          TOKEN=$(echo "$RESPONSE" | jq -r '.authentication.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::Login failed — scan would run unauthenticated, aborting"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Authenticated successfully"

      # ---------------------------------------------------------------
      # 3. Scan
      # ---------------------------------------------------------------
      - name: Prepare report directory
        run: |
          mkdir -p zap-out
          chmod 777 zap-out          # ZAP container writes as a different uid

      - name: ZAP authenticated full scan
        run: |
          docker run --rm \
            --network zapnet \
            -v "${GITHUB_WORKSPACE}/zap-out:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-full-scan.py \
              -t http://juiceshop:3000 \
              -r report_html.html \
              -J report_json.json \
              -m 5 \
              -I \
              -z "-config replacer.full_list\(0\).description=auth \
                  -config replacer.full_list\(0\).enabled=true \
                  -config replacer.full_list\(0\).matchtype=REQ_HEADER \
                  -config replacer.full_list\(0\).matchstr=Authorization \
                  -config replacer.full_list\(0\).regex=false \
                  -config replacer.full_list\(0\).replacement=Bearer\ ${{ steps.auth.outputs.token }}" \
          || echo "ZAP exited non-zero (findings present) — continuing to publish report"

      - name: Show finding counts
        run: |
          if [ -f zap-out/report_json.json ]; then
            jq -r '[.site[].alerts[]] | group_by(.riskdesc | split(" ")[0])
                   | map({risk: .[0].riskdesc | split(" ")[0], count: length})
                   | .[] | "\(.risk): \(.count)"' zap-out/report_json.json
          fi

      # ---------------------------------------------------------------
      # 4. Publish
      # ---------------------------------------------------------------
      - name: Assemble report site
        run: |
          mkdir -p site
          cp zap-out/report_html.html site/index.html
          cp zap-out/report_json.json site/report.json || true
          # keep the written analysis next to the raw output
          cp -r docs/* site/ 2>/dev/null || true

      - name: Upload raw reports as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-out/
          retention-days: 30

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ---------------------------------------------------------------
      # 5. Tear down
      # ---------------------------------------------------------------
      - name: Clean up
        if: always()
        run: |
          docker rm -f juiceshop || true
          docker network rm zapnet || true
